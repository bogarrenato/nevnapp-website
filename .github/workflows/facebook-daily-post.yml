name: Manual Facebook nameday photo

on:
  # Daily Facebook publishing uses facebook-daily-reel.yml, not photos.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: daily-facebook-nameday-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Post today's nameday to Facebook
        env:
          PUBLIC_SITE_URL: https://nevnap.app
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_ID" ] || [ -z "$FB_PAGE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Facebook publishing credentials."
            exit 1
          fi
          npm run facebook:post
