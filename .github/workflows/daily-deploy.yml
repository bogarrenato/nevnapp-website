name: Daily rebuild & deploy

# The live homepage computes the Budapest date in Pages Functions on each
# request. This daily build refreshes static fallback pages and social media;
# a disabled GitHub schedule can no longer freeze the live homepage.

on:
  push:
    branches: [main]
  schedule:
    # Always after Budapest midnight: 00:45 CET / 01:45 CEST.
    - cron: '45 23 * * *'
  workflow_dispatch:        # kézi indítás is lehetséges

permissions:
  contents: read

concurrency:
  group: production-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build static pages and daily fallback
        run: npm run build

      - name: Test request-time namedays and Budapest date boundaries
        run: node --test tests/daily-runtime.test.mjs

      - name: Build social reel
        run: npm run social:reel

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4.149.0 pages deploy dist --project-name=nevnap-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify current nameday on the live website
        run: node scripts/check-daily-site.mjs
